name: Build Easycontrol EN

on:
  push:
    branches: [english-fork]
    tags: ['en-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Check English source and resources
        run: python tools/check-no-cjk.py
      - name: Install Android SDK 33
        run: sdkmanager 'platforms;android-33' 'build-tools;30.0.3' 'build-tools;33.0.2'
      - name: Build server and APK
        working-directory: easycontrol
        run: |
          chmod +x gradlew
          ./gradlew :server:copyRelease :app:assembleRelease
      - name: Sign and verify release APK
        shell: bash
        env:
          EASYCONTROL_KEYSTORE_B64: ${{ secrets.EASYCONTROL_KEYSTORE_B64 }}
          EASYCONTROL_KEYSTORE_PASSWORD: ${{ secrets.EASYCONTROL_KEYSTORE_PASSWORD }}
          EASYCONTROL_KEY_ALIAS: ${{ secrets.EASYCONTROL_KEY_ALIAS }}
        run: |
          : "${EASYCONTROL_KEYSTORE_B64:?Missing EASYCONTROL_KEYSTORE_B64}"
          : "${EASYCONTROL_KEYSTORE_PASSWORD:?Missing EASYCONTROL_KEYSTORE_PASSWORD}"
          : "${EASYCONTROL_KEY_ALIAS:?Missing EASYCONTROL_KEY_ALIAS}"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/easycontrol-signing.XXXXXX")
          keystore="$signing_dir/key.p12"
          aligned_apk="$signing_dir/aligned.apk"
          trap 'rm -f -- "$keystore" "$aligned_apk"; rmdir -- "$signing_dir"' EXIT
          printf '%s' "$EASYCONTROL_KEYSTORE_B64" | base64 --decode > "$keystore"
          build_tools="$ANDROID_HOME/build-tools/33.0.2"
          "$build_tools/zipalign" -f -p 4 easycontrol/app/build/outputs/apk/release/app-release-unsigned.apk "$aligned_apk"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-type PKCS12 \
            --ks-key-alias "$EASYCONTROL_KEY_ALIAS" \
            --ks-pass env:EASYCONTROL_KEYSTORE_PASSWORD \
            --key-pass env:EASYCONTROL_KEYSTORE_PASSWORD \
            --out Easycontrol-EN.apk "$aligned_apk"
          "$build_tools/apksigner" verify --verbose Easycontrol-EN.apk
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Easycontrol-EN
          path: Easycontrol-EN.apk
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'en-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.0
        with:
          name: Easycontrol-EN
      - name: Attach APK to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Easycontrol-EN.apk --clobber
          else
            gh release create "$RELEASE_TAG" Easycontrol-EN.apk --verify-tag --generate-notes
          fi
