plugins {
    id 'com.android.application' version '8.0.2'
}

android {
    namespace 'top.saymzx.easycontrol.app'
    compileSdk 33

    defaultConfig {
        applicationId "io.github.nashthuo.easycontrol"
        minSdk 23
        targetSdk 33
        versionCode 10013 + (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
        versionName "1.0.13-en"
        resConfigs "en", "zh", "xhdpi"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "true"
            debuggable true
        }
        release {
            buildConfigField "boolean", "ENABLE_DEBUG_FEATURE", "false"
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources.excludes.add("META-INF/*")
    }
}

// Prepare the server resource before AGP reads the release source set.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn ':server:copyRelease'
}

dependencies {
}
